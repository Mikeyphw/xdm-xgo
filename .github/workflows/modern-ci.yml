name: XDM Modern CI

on:
  push:
    branches: [master, main, modern]
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  modern-fast:
    # Cheap source-integrity and release-contract audits on every PR hotfix.
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Firefox single-extension source integrity
        run: python3 app/XDM/eng/validate-xfe01-single-firefox-extension.py
      - name: Desktop REM18 release matrix source audit
        run: python3 app/XDM/eng/rem18-release-matrix-audit.py
      - name: Hotfix/full CI gating contract
        run: python3 -B scripts/test_xgo_mp01_hf04_ci_tiers.py

  validate:
    needs: modern-fast
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'xdm-full-ci')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore modern solution
        run: dotnet restore app/XDM/XDM.Modern.sln
      - name: Build modern solution
        run: dotnet build app/XDM/XDM.Modern.sln -c Release --no-restore -warnaserror
      - name: Test modern solution and final-gate contracts
        run: dotnet test app/XDM/XDM.Modern.sln -c Release --no-build --logger trx --results-directory artifacts/test-results
      - name: Bootstrap smoke test
        run: dotnet run --project app/XDM/src/XDM.App/XDM.App.csproj -c Release --no-build -- --validate-bootstrap
      - name: REM18 final seal static audit
        if: runner.os == 'Linux'
        run: bash app/XDM/eng/rem18-final-release-seal.sh --static-only
      - name: REM18 final seal static audit
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./app/XDM/eng/rem18-final-release-seal.ps1 -StaticOnly
      - name: Linux x64 final-gate package smoke
        if: runner.os == 'Linux'
        run: bash app/XDM/eng/smoke-package.sh linux-x64
      - uses: actions/setup-go@v5
        if: runner.os == 'Windows'
        with:
          go-version-file: engine/go.mod
      - name: Windows SQLite embedded CGO regression
        if: runner.os == 'Windows'
        shell: pwsh
        run: go test -count=1 ./engine/store/sqlite
      - name: Windows x64 final-gate package smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./app/XDM/eng/smoke-package.ps1 -Runtime win-x64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-gate-${{ runner.os }}
          path: |
            artifacts/test-results
            artifacts/smoke
          if-no-files-found: ignore

  modern-pr-merge-qualification:
    # Fast-only does not qualify a desktop release. The final PR head needs
    # BOTH OS matrix lanes plus native Linux/Windows ARM64 toolchains.
    if: always() && github.event_name == 'pull_request'
    needs: [modern-fast, validate, native-linux-arm64, native-windows-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require native cross-platform qualification for this PR
        shell: bash
        env:
          FAST_RESULT: ${{ needs.modern-fast.result }}
          MATRIX_RESULT: ${{ needs.validate.result }}
          LINUX_ARM64_RESULT: ${{ needs.native-linux-arm64.result }}
          WINDOWS_ARM64_RESULT: ${{ needs.native-windows-arm64.result }}
        run: |
          set -euo pipefail
          if [[ "$FAST_RESULT" != success || "$MATRIX_RESULT" != success || "$LINUX_ARM64_RESULT" != success || "$WINDOWS_ARM64_RESULT" != success ]]; then
            echo '::error::XGO_MODERN_PR_NOT_QUALIFIED: fast-only checks are not release approval. Add label xdm-full-ci for full modern matrix and native ARM64 qualification.'
            exit 1
          fi
          echo 'XGO_MODERN_PR_FULLY_QUALIFIED: desktop matrix and native Linux/Windows ARM64 passed for current PR head'

  native-linux-arm64:
    needs: modern-fast
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'xdm-full-ci')
    # Build Go c-shared and run the published .NET app on its real CPU ABI.
    # Never silently substitute an AMD64-only structural publish for ARM64.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
      - name: Linux ARM64 native package and bootstrap smoke
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(go env GOARCH)" = arm64
          bash app/XDM/eng/smoke-package.sh linux-arm64
          go run ./engine/cmd/xgo-provenance \
            --validate artifacts/smoke/linux-arm64/xdmcore-provenance.json \
            --goos linux --goarch arm64 --build-mode c-shared
          readelf -h artifacts/smoke/linux-arm64/libxdmcore.so | grep -Eq 'Machine:.*AArch64'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-gate-Linux-arm64
          path: artifacts/smoke/linux-arm64
          if-no-files-found: ignore

  native-windows-arm64:
    needs: modern-fast
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'xdm-full-ci')
    # Native ARM64 c-shared builds must not be faked by an x64-only publish.
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
      - name: Provision SHA-256 pinned Windows ARM64 LLVM-MinGW compiler
        shell: pwsh
        run: ./app/XDM/eng/setup-windows-arm64-cgo.ps1
      - name: Windows ARM64 SQLite and Go C compiler preflight
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((& go env GOOS).Trim() -ne 'windows' -or (& go env GOARCH).Trim() -ne 'arm64') {
            throw 'Expected a native Windows ARM64 runner'
          }
          & go env CGO_ENABLED CC
          & go test -count=1 ./engine/store/sqlite
          if ($LASTEXITCODE -ne 0) { throw 'Windows ARM64 embedded SQLite tests failed' }
      - name: Windows ARM64 native package and bootstrap smoke
        shell: pwsh
        run: ./app/XDM/eng/smoke-package.ps1 -Runtime win-arm64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-gate-Windows-arm64
          path: artifacts/smoke/win-arm64
          if-no-files-found: ignore
