# Opt-in x86 native media + MP08B3 API36 acceptance; NEVER a release gate.
name: XGO x86_64 Native Media Runtime (opt-in only)
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
  actions: read  # only for same-repo, SHA/ABI/source-verified artifact reuse
concurrency:
  group: xgo-x86-native-media-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  x86-native-media:
    name: Exact-head x86_64 FFmpeg FFprobe aria2 source build and API36 runtime
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'labeled' &&
      github.event.label.name == 'xgo-x86-native-media' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.repository == 'Mikeyphw/xdm-xgo'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      XGO_X86_MEDIA_OPT_IN: 'yes'
      GITHUB_EVENT_ACTION: ${{ github.event.action }}
      XGO_X86_MEDIA_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      XDM_FFMPEG_AUTO_INSTALL_HOST_TOOLS: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact-head stacked PR and opt-in provenance
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          OWNER: ${{ github.event.pull_request.head.repo.full_name }}
          LABEL_NAME: ${{ github.event.label.name }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          if [[ "$BASE_BRANCH" == feature/xgo-x86-media-runtimes-20261110 ]]; then
            # Preserve the original exact-base x86_64 lane unchanged.
            test "$BASE_SHA" = 36e8e318305023a8edbc5cff836bfeea2f5c56d6
            test "$BASE_BRANCH" = feature/xgo-x86-media-runtimes-20261110
          elif [[ "$BASE_BRANCH" == feature/xgo-mp09-p02-durable-live-poll-20261111 ]]; then
            # MP09 PR28: a distinct opt-in path, pinned to the stacked PR27 base.
            test "$BASE_SHA" = 1a0806a069ae27eea322332c9f05f70cf6fd4d34
            test "$PR_NUMBER" = 28
            test "$HEAD_BRANCH" = feature/xgo-mp09-consolidated-recording-20261111
          else
            echo 'XGO_X86_MEDIA_REFUSED_UNAPPROVED_STACKED_BASE' >&2
            exit 2
          fi
          test "$OWNER" = "$GITHUB_REPOSITORY"
          test "$LABEL_NAME" = xgo-x86-native-media
          git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"
      - name: Initialize x86_64 native source and object cache directories
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNNER_TEMP:-}" && test -d "$RUNNER_TEMP" || exit 2
          test -n "${GITHUB_ENV:-}" && test -f "$GITHUB_ENV" || exit 2
          for directory in x86-ffmpeg x86-aria2 x86-openssl; do
            install -d -m 0700 "$RUNNER_TEMP/$directory"
          done
          printf 'XDM_FFMPEG_BUILD_CACHE=%s\n' "$RUNNER_TEMP/x86-ffmpeg" >> "$GITHUB_ENV"
          printf 'XDM_ARIA2_SOURCE_CACHE_DIR=%s\n' "$RUNNER_TEMP/x86-aria2" >> "$GITHUB_ENV"
          printf 'XDM_ANDROID_NATIVE_DEPS_CACHE=%s\n' "$RUNNER_TEMP/x86-openssl" >> "$GITHUB_ENV"
          echo 'XGO_X86_64_NATIVE_BUILD_CACHE_PATHS_READY'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Static source, security and negative-mutation contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/test_xgo_x86_native_media.py
          python3 -B scripts/test_xgo_mp08b3_x86_integration.py
          python3 -B scripts/test_xgo_mp08b3_x86_optimizations.py
          python3 -B scripts/test_xgo_mp08b3_x86_hf05_ci.py
          python3 -B scripts/xgo_mp08b3_x86_optimize.py check
          python3 -B scripts/test_xgo_native_cache_contract.py
          python3 -B scripts/xgo_x86_native_media.py check
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v6
        with:
          go-version-file: engine/go.mod
          cache: false  # setup-go's shared ~/go tar restore races with existing module files
      - name: Initialize isolated x86_64 Go module and build caches
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/xgo-x86-go-mod" "$RUNNER_TEMP/xgo-x86-go-build"
          printf 'GOMODCACHE=%s\n' "$RUNNER_TEMP/xgo-x86-go-mod" >> "$GITHUB_ENV"
          printf 'GOCACHE=%s\n' "$RUNNER_TEMP/xgo-x86-go-build" >> "$GITHUB_ENV"
      - name: Restore and save isolated x86_64 Go cache (Node24)
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/xgo-x86-go-mod
            ${{ runner.temp }}/xgo-x86-go-build
          key: ${{ runner.os }}-xgo-x86-go123-v1-${{ hashFiles('engine/go.mod', 'engine/go.sum') }}
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          # Trusted, explicitly labeled same-repo PR only. Never use this for forks.
          cache-read-only: false
      - name: Install pinned toolchain and real source-build dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/xgo_ci_perf_receipt.py mark toolchain start
          trap 'python3 -B scripts/xgo_ci_perf_receipt.py mark toolchain end' EXIT
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools' 'emulator' 'system-images;android-36;google_apis;x86_64' 'ndk;29.0.14206865'
          required=(gcc g++ pkg-config perl nasm yasm autoconf automake libtoolize cmake make)
          missing=()
          for executable in "${required[@]}"; do
            if ! command -v "$executable" >/dev/null 2>&1; then missing+=("$executable"); fi
          done
          if (( ${#missing[@]} )); then
            echo "XGO_X86_OPT_MISSING_HOST_TOOLS=${missing[*]}"
            sudo apt-get update -qq
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential pkg-config perl nasm yasm autoconf automake libtool cmake make
          else
            echo 'XGO_X86_OPT_PINNED_HOST_TOOLS_ALREADY_PRESENT'
          fi
      - name: Test-only pinned x86_64 source profile (NEVER committed)
        id: native-profile
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/xgo_x86_native_media.py prepare --head "$XGO_X86_MEDIA_EXPECTED_HEAD"
          python3 -B scripts/xgo_mp08b3_x86_optimize.py prepare --head "$XGO_X86_MEDIA_EXPECTED_HEAD"
          python3 -B scripts/xgo_verified_native_artifact.py fingerprint --github-output "$GITHUB_OUTPUT"
      - name: Restore x86_64 verified native source and object cache
        uses: actions/cache/restore@v5
        id: xgo-native-cache
        with:
          path: |
            ${{ runner.temp }}/x86-ffmpeg
            ${{ runner.temp }}/x86-aria2
            ${{ runner.temp }}/x86-openssl
            app/XDM.Android/media-ffmpeg/src/main/jniLibs/x86_64/libxdm_ffmpeg.so
            app/XDM.Android/media-ffmpeg/src/main/jniLibs/x86_64/libxdm_ffprobe.so
            app/XDM.Android/media-ffmpeg/runtime/ffmpeg-runtime.lock.json
            app/XDM.Android/transfer-aria2/src/main/jniLibs/x86_64/libaria2c.so
            app/XDM.Android/transfer-aria2/runtime/aria2-runtime.lock.json
            app/XDM.Android/media-ffmpeg/runtime/licenses/FFmpeg-LGPL-2.1.txt
            app/XDM.Android/media-ffmpeg/runtime/licenses/OpenSSL-Apache-2.0.txt
            app/XDM.Android/transfer-aria2/runtime/licenses/GPL-2.0.txt
            app/XDM.Android/transfer-aria2/runtime/licenses/SOURCE-NOTICE.txt
          key: ${{ runner.os }}-ndk29.0.14206865-x86_64-native-v2-licenses-v1-${{ hashFiles('app/XDM.Android/media-ffmpeg/runtime/ffmpeg-runtime.json', 'app/XDM.Android/transfer-aria2/runtime/aria2-runtime.json', 'app/XDM.Android/tools/install-ffmpeg-runtime.py', 'app/XDM.Android/tools/build-aria2-runtime.py', 'app/XDM.Android/tools/android_native_openssl.py', 'app/XDM.Android/tools/android_elf_runtime.py', 'scripts/xgo_x86_native_media.py', 'scripts/xgo_x86_64_profile.py', 'tools/xgo/build_android_xdmcore_x86_64.py') }}
      - name: Build and independently verify native FFmpeg FFprobe and aria2
        id: native-source
        shell: bash
        working-directory: app/XDM.Android
        env:
          GH_TOKEN: ${{ github.token }}
          XGO_NATIVE_OBJECT_CACHE_HIT: ${{ steps.xgo-native-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          python3 -B ../../scripts/xgo_ci_perf_receipt.py mark native start
          trap 'python3 -B ../../scripts/xgo_ci_perf_receipt.py mark native end' EXIT
          if [[ "$XGO_NATIVE_OBJECT_CACHE_HIT" == 'true' ]]; then
            # Cache entry includes ELF bytes AND source locks. A corrupt hit refuses.
            python3 -B tools/verify-ffmpeg-runtime.py --require-payload --require-16kb-alignment
            python3 -B tools/verify-aria2-runtime.py --require-payload --require-16kb-alignment --require-source-build
            python3 -B ../../scripts/xgo_ci_perf_receipt.py mode same-pr-native-cache
            echo 'mode=same-pr-native-cache' >> "$GITHUB_OUTPUT"
          elif python3 -B ../../scripts/xgo_verified_native_artifact.py restore; then
            python3 -B ../../scripts/xgo_ci_perf_receipt.py mode cross-pr-artifact
            echo 'mode=cross-pr-artifact' >> "$GITHUB_OUTPUT"
          else
            rc=$?
            if [[ "$rc" -ne 10 ]]; then
              echo 'XGO_X86_OPT_REFUSED: corrupt or unauthorized artifact' >&2
              exit "$rc"
            fi
            # Only pinned source and identical ABI/NDK/recipe inputs may be reused.
            python3 -B ../../scripts/xgo_ci_perf_receipt.py mode pinned-source-build
            echo 'mode=pinned-source-build' >> "$GITHUB_OUTPUT"
            python3 -B tools/install-ffmpeg-runtime.py --build-pinned --jobs 2
            python3 -B tools/build-aria2-runtime.py --build-pinned --jobs 2
          fi
          # Both paths require the exact same independent source/ELF/lock check.
          python3 -B tools/verify-ffmpeg-runtime.py --require-payload --require-16kb-alignment
          python3 -B tools/verify-aria2-runtime.py --require-payload --require-16kb-alignment --require-source-build
          python3 -B ../../scripts/xgo_verified_native_artifact.py pack --out "$RUNNER_TEMP/xgo-x86-native-artifact/native-output.zip"
          printf 'XGO_X86_NATIVE_ATTESTED=yes\n' >> "$GITHUB_ENV"
          echo 'XGO_X86_OPT_VERIFIED_NATIVE_OUTPUTS_READY' 
      - name: Save x86_64 verified native source and object cache
        if: steps.xgo-native-cache.outputs.cache-hit != 'true' && steps.native-source.outputs.mode == 'pinned-source-build'
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ runner.temp }}/x86-ffmpeg
            ${{ runner.temp }}/x86-aria2
            ${{ runner.temp }}/x86-openssl
            app/XDM.Android/media-ffmpeg/src/main/jniLibs/x86_64/libxdm_ffmpeg.so
            app/XDM.Android/media-ffmpeg/src/main/jniLibs/x86_64/libxdm_ffprobe.so
            app/XDM.Android/media-ffmpeg/runtime/ffmpeg-runtime.lock.json
            app/XDM.Android/transfer-aria2/src/main/jniLibs/x86_64/libaria2c.so
            app/XDM.Android/transfer-aria2/runtime/aria2-runtime.lock.json
            app/XDM.Android/media-ffmpeg/runtime/licenses/FFmpeg-LGPL-2.1.txt
            app/XDM.Android/media-ffmpeg/runtime/licenses/OpenSSL-Apache-2.0.txt
            app/XDM.Android/transfer-aria2/runtime/licenses/GPL-2.0.txt
            app/XDM.Android/transfer-aria2/runtime/licenses/SOURCE-NOTICE.txt
          key: ${{ steps.xgo-native-cache.outputs.cache-primary-key }}
      - name: Upload verified source-built native output for future cross-PR reuse
        if: steps.native-source.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.native-profile.outputs.name }}
          path: ${{ runner.temp }}/xgo-x86-native-artifact/native-output.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Build genuine x86_64 app and instrumentation APKs
        shell: bash
        working-directory: app/XDM.Android
        run: |
          set -euo pipefail
          python3 -B ../../scripts/xgo_ci_perf_receipt.py mark gradle_apk start
          trap 'python3 -B ../../scripts/xgo_ci_perf_receipt.py mark gradle_apk end' EXIT
          # CI-only, provenance-verified: native Exec tasks skip duplicate builds.
          # Independent Gradle verify tasks remain mandatory and fail closed.
          ./gradlew --no-daemon --max-workers=2 -Pxdm.preverifiedNativeRuntime=true -Pxdm.requireFfmpegRuntime=true -Pxdm.requireAria2Runtime=true :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Verify every APK native payload and source-build lock
        shell: bash
        run: >-
          python3 -B scripts/xgo_x86_native_media.py verify-apk
          --head "$XGO_X86_MEDIA_EXPECTED_HEAD"
          --apk app/XDM.Android/app/build/outputs/apk/debug/app-debug.apk
          --receipt "$RUNNER_TEMP/xgo-x86-media/native-media-receipt.json"
      - name: Enable KVM and confirm actual guest support
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            sudo chown "$(id -u):$(id -g)" /dev/kvm
            sudo chmod 0600 /dev/kvm
          fi
          python3 - <<'PY_KVM'
          import os
          handle=os.open('/dev/kvm',os.O_RDWR|os.O_CLOEXEC)
          os.close(handle)
          print('XGO_X86_MEDIA_KVM_OPEN_PASS')
          PY_KVM
      - name: Mark real emulator acceptance start
        shell: bash
        run: python3 -B scripts/xgo_ci_perf_receipt.py mark emulator start
      - name: Real API36 x86_64 FFmpeg FFprobe and aria2 instrumented execution
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          # A single POSIX command: the action invokes sh -c separately per line.
          # P01: one POSIX-safe line; three native tests, then four real MP08B3 cases, same API36 emulator.
          # The second command cannot run when the first fails. Neither may be skipped.
          script: python3 -B scripts/xgo_x86_native_media.py emulator --head "$XGO_X86_MEDIA_EXPECTED_HEAD" --evidence "$RUNNER_TEMP/xgo-x86-media" && python3 -B scripts/xgo_mp08b3_x86_integration.py run --head "$XGO_X86_MEDIA_EXPECTED_HEAD" --evidence "$RUNNER_TEMP/xgo-x86-media"
      - name: Write phase timings, native reuse mode and cache diagnostics
        if: always()
        shell: bash
        env:
          PHASE_JOB_STATUS: ${{ job.status }}
          XGO_NATIVE_SOURCE_CACHE_HIT: ${{ steps.xgo-native-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/xgo-x86-perf/emulator.start.json" && ! -e "$RUNNER_TEMP/xgo-x86-perf/emulator.end.json" ]]; then
            python3 -B scripts/xgo_ci_perf_receipt.py mark emulator end
          fi
          python3 -B scripts/xgo_ci_perf_receipt.py summary --status "$PHASE_JOB_STATUS"
          mkdir -p "$RUNNER_TEMP/xgo-x86-media"
          cp "$RUNNER_TEMP/xgo-x86-perf/performance.json" "$RUNNER_TEMP/xgo-x86-media/performance.json"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: xgo-x86-native-media-evidence-not-arm64
          path: ${{ runner.temp }}/xgo-x86-media/
          retention-days: 7
          if-no-files-found: error
