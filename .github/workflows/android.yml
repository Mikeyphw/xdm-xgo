name: XDM Android CI

on:
  push:
    paths:
      - 'app/XDM.Android/**'
      - 'engine/**'
      - 'go.work'
      - 'tools/xgo/**'
      - '.devtool.toml'
      - 'build-release-apk.sh'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'app/XDM.Android/**'
      - 'engine/**'
      - 'go.work'
      - 'tools/xgo/**'
      - '.devtool.toml'
      - 'build-release-apk.sh'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      signed_release:
        description: 'Authorize signing only for an android-v* release tag'
        required: false
        type: boolean
        default: false
      firebase_spark:
        description: "Use one real ARM64 physical device via Spark (no-cost)"
        required: false
        type: boolean
        default: false
      model_id:
        description: "Physical ARM64 Test Lab model ID from gcloud catalog"
        required: false
        type: string
        default: ""
      version_id:
        description: "Android version supported by selected physical model"
        required: false
        type: string
        default: "36"
      confirm_spark:
        description: "I verified this Firebase project is on the no-cost Spark plan"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  XDM_ANDROID_NDK_VERSION: '29.0.14206865'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app/XDM.Android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platform-tools'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Android SDK and NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;${XDM_ANDROID_NDK_VERSION}"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Static release contracts
        run: |
          python3 tools/validate-xar01-build-provenance.py
          python3 tools/validate-bug-hunt-phase10-release-upgrade-packaging.py
          python3 tools/verify-phase10-backup-policy.py
          python3 tools/validate-uix-r6-accessibility-performance-release-seal.py
          python3 tools/validate-bug-hunt-phase11-validation-matrix.py
          python3 tools/validate-xar17-313-root-closure.py
          bash tools/run-bug-hunt-phase11-validation-matrix.sh --static-only --ci
          python3 tools/validate-xar16-release-evidence-seal.py
          bash tools/run-final-release-gate.sh --ci
      - name: Bootstrap wrapper
        run: test -f gradle/wrapper/gradle-wrapper.jar || gradle wrapper --gradle-version 9.7.1
      - name: Post-DL03 final common validation
        run: bash tools/run-final-common-validation.sh
      - uses: actions/upload-artifact@v4
        with:
          name: xdm-android-debug-artifacts
          path: |
            app/XDM.Android/app/build/outputs/apk/debug/*.apk
            app/XDM.Android/browser-extension/build/outputs/xpi/*.xpi
            app/XDM.Android/browser-extension/build/outputs/xpi/release-artifacts.json
          if-no-files-found: error

  instrumentation:
    if: github.event_name != 'workflow_dispatch' || !inputs.firebase_spark
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Provision Cinderbox-proven API36 Google APIs image
        shell: bash
        run: |
          set -euo pipefail
          bash app/XDM.Android/tools/provision-hosted-emulator-runtime.sh --prepare
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
          for attempt in 1 2 3; do
            if sdkmanager --install 'emulator' 'system-images;android-36;google_apis;x86_64'; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::XDM_API36_IMAGE_INSTALL_FAILED"
              exit 1
            fi
            sleep 10
          done
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?}}"
          bash app/XDM.Android/tools/provision-hosted-emulator-runtime.sh --verify "$sdk_root"
          test -d "$sdk_root/system-images/android-36/google_apis/x86_64"
          avd_root="${ANDROID_AVD_HOME:-$HOME/.android/avd}"
          mkdir -p "$avd_root"
          available_kib="$(df -Pk "$avd_root" | awk 'END {print $4}')"
          [[ "$available_kib" =~ ^[0-9]+$ ]] || { echo "::error::XDM_AVD_DISK_QUERY_FAILED"; exit 1; }
          (( available_kib >= 4 * 1024 * 1024 )) || { echo "::error::XDM_AVD_DISK_INSUFFICIENT"; exit 1; }
      - name: Require KVM acceleration for Android instrumentation
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -c /dev/kvm ]]; then
            echo "::error::/dev/kvm is unavailable; refusing unaccelerated Android instrumentation"
            exit 1
          fi
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Android instrumentation matrix
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          disk-size: 3072M
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash app/XDM.Android/tools/run-hosted-emulator-instrumentation.sh --device
      - name: Upload bounded hosted instrumentation crash evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xdm-hosted-instrumentation-evidence
          path: ${{ runner.temp }}/xdm-instrumentation-evidence/
          retention-days: 7
          if-no-files-found: warn

  signed-release:
    if: startsWith(github.ref, 'refs/tags/android-v') && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.signed_release))
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: app/XDM.Android
    env:
      XDM_RELEASE_STORE_FILE: ${{ github.workspace }}/release-keystore.jks
      XDM_RELEASE_STORE_PASSWORD: ${{ secrets.XDM_RELEASE_STORE_PASSWORD }}
      XDM_RELEASE_KEY_ALIAS: ${{ secrets.XDM_RELEASE_KEY_ALIAS }}
      XDM_RELEASE_KEY_PASSWORD: ${{ secrets.XDM_RELEASE_KEY_PASSWORD }}
      XDM_RELEASE_SIGNER_SHA256: ${{ secrets.XDM_RELEASE_SIGNER_SHA256 }}
      XDM_RELEASE_CERTIFICATE_NOT_AFTER: ${{ secrets.XDM_RELEASE_CERTIFICATE_NOT_AFTER }}
      XDM_RELEASE_BUILD_ID: ${{ github.sha }}
      XDM_XAR16_PREVIOUS_RELEASE_APK: ${{ github.workspace }}/previous-release.apk
      XDM_XAR16_FULL_RELEASE_GATE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platform-tools'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore release keystore
        env:
          XDM_RELEASE_KEYSTORE_BASE64: ${{ secrets.XDM_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$XDM_RELEASE_KEYSTORE_BASE64"
          printf '%s' "$XDM_RELEASE_KEYSTORE_BASE64" | base64 -d > "$XDM_RELEASE_STORE_FILE"
      - name: Install pinned Android SDK and NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;${XDM_ANDROID_NDK_VERSION}"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Provision pinned bundletool
        run: echo "BUNDLETOOL_JAR=$(python3 tools/ensure-bundletool.py --print-path)" >> "$GITHUB_ENV"
      - name: Build pinned ARM64 aria2 runtime from source
        run: |
          python3 tools/build-aria2-runtime.py --build-pinned
      - name: Build pinned FFmpeg runtime
        run: python3 tools/install-ffmpeg-runtime.py --build-pinned
      - name: Fetch provenance-pinned previous release fixture
        env:
          XDM_PREVIOUS_RELEASE_APK_URL: ${{ secrets.XDM_PREVIOUS_RELEASE_APK_URL }}
          XDM_PREVIOUS_RELEASE_APK_SHA256: ${{ secrets.XDM_PREVIOUS_RELEASE_APK_SHA256 }}
        run: |
          test -n "$XDM_PREVIOUS_RELEASE_APK_URL"
          test -n "$XDM_PREVIOUS_RELEASE_APK_SHA256"
          curl --fail --location --proto '=https' "$XDM_PREVIOUS_RELEASE_APK_URL" --output "$XDM_XAR16_PREVIOUS_RELEASE_APK"
          printf '%s  %s\n' "$XDM_PREVIOUS_RELEASE_APK_SHA256" "$XDM_XAR16_PREVIOUS_RELEASE_APK" | sha256sum --check --strict
      - name: Provision Cinderbox-proven API36 Google APIs image
        shell: bash
        run: |
          set -euo pipefail
          bash tools/provision-hosted-emulator-runtime.sh --prepare
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
          for attempt in 1 2 3; do
            if sdkmanager --install 'emulator' 'system-images;android-36;google_apis;x86_64'; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::XDM_API36_IMAGE_INSTALL_FAILED"
              exit 1
            fi
            sleep 10
          done
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?}}"
          bash tools/provision-hosted-emulator-runtime.sh --verify "$sdk_root"
          test -d "$sdk_root/system-images/android-36/google_apis/x86_64"
          avd_root="${ANDROID_AVD_HOME:-$HOME/.android/avd}"
          mkdir -p "$avd_root"
          available_kib="$(df -Pk "$avd_root" | awk 'END {print $4}')"
          [[ "$available_kib" =~ ^[0-9]+$ ]] || { echo "::error::XDM_AVD_DISK_QUERY_FAILED"; exit 1; }
          (( available_kib >= 4 * 1024 * 1024 )) || { echo "::error::XDM_AVD_DISK_INSUFFICIENT"; exit 1; }
      - name: Require KVM acceleration for Android instrumentation
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -c /dev/kvm ]]; then
            echo "::error::/dev/kvm is unavailable; refusing unaccelerated Android instrumentation"
            exit 1
          fi
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Signed release, instrumentation, install, upgrade, and reboot gate
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          disk-size: 3072M
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash app/XDM.Android/tools/run-hosted-emulator-instrumentation.sh --signed-release
      - name: Upload bounded hosted release instrumentation crash evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xdm-hosted-release-instrumentation-evidence
          path: ${{ runner.temp }}/xdm-instrumentation-evidence/
          retention-days: 7
          if-no-files-found: warn
      - name: Attest Android publication metadata
        uses: actions/attest@v4
        with:
          subject-path: |
            app/XDM.Android/build/release/publication/SHA256SUMS
            app/XDM.Android/build/release/publication/SHA512SUMS
            app/XDM.Android/build/release/publication/release-metadata.json
      - uses: actions/upload-artifact@v4
        with:
          name: xdm-android-signed-release
          path: app/XDM.Android/build/release/publication/**/*
          if-no-files-found: error

  firebase-spark-arm64:
    if: github.event_name == 'workflow_dispatch' && inputs.firebase_spark
    concurrency:
      group: xgo-firebase-spark-arm64-single-physical
      cancel-in-progress: false
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      id-token: write
    env:
      XGO_FIREBASE_PROJECT_ID: ${{ vars.XGO_FIREBASE_PROJECT_ID }}
      XGO_FIREBASE_WIF_PROVIDER: ${{ vars.XGO_FIREBASE_WIF_PROVIDER }}
      XGO_FIREBASE_SERVICE_ACCOUNT: ${{ vars.XGO_FIREBASE_SERVICE_ACCOUNT }}
      XGO_SPARK_MODEL: ${{ inputs.model_id }}
      XGO_SPARK_VERSION: ${{ inputs.version_id }}
      XGO_SPARK_CONFIRMED: ${{ inputs.confirm_spark }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Enforce manual single-device Spark-only admission
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == 'Mikeyphw/xdm-xgo' ]] || { echo 'XGO_SPARK_REPO_REFUSED'; exit 2; }
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]] || { echo 'XGO_SPARK_MANUAL_ONLY'; exit 2; }
          [[ "$XGO_SPARK_CONFIRMED" == true ]] || { echo 'XGO_SPARK_NO_COST_PLAN_NOT_CONFIRMED'; exit 2; }
          [[ "$XGO_FIREBASE_PROJECT_ID" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]] || { echo 'XGO_SPARK_PROJECT_NOT_CONFIGURED'; exit 2; }
          [[ "$XGO_FIREBASE_WIF_PROVIDER" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[^/]+/providers/[^/]+$ ]] || { echo 'XGO_SPARK_WIF_NOT_CONFIGURED'; exit 2; }
          [[ "$XGO_FIREBASE_SERVICE_ACCOUNT" == *'@'*'.iam.gserviceaccount.com' ]] || { echo 'XGO_SPARK_SERVICE_ACCOUNT_NOT_CONFIGURED'; exit 2; }
          [[ "$XGO_SPARK_MODEL" =~ ^[A-Za-z0-9._-]{2,80}$ ]] || { echo 'XGO_SPARK_MODEL_ID_REFUSED'; exit 2; }
          [[ "$XGO_SPARK_VERSION" =~ ^[0-9]{2,3}$ ]] || { echo 'XGO_SPARK_VERSION_ID_REFUSED'; exit 2; }
          echo 'XGO_SPARK_ADMISSION_PASS: manual, one physical ARM64 device, Spark confirmed by requester'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools'
      - name: Provision Android platform and pinned NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Validate retained source and native release contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/devtool_phase02_source_contract.py
          python3 -B scripts/test_xgo_hf11_contracts.py
          python3 -B scripts/test_xgo_hf12_emulator_provision.py
          python3 -B scripts/test_xgo_hf13_crash_evidence.py
          python3 -B app/XDM.Android/tools/validate-xar16-release-evidence-seal.py
      - name: Build actual Android debug and instrumentation APKs (hosted only)
        working-directory: app/XDM.Android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache --max-workers=2 \
            :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Require real packaged AArch64 Go JNI core and test APK
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/xgo_firebase_spark_arm64.py check-apks \
            --app app/XDM.Android/app/build/outputs/apk/debug/app-debug.apk \
            --test app/XDM.Android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          mkdir -p "$RUNNER_TEMP/xgo-spark-evidence"
          sha256sum app/XDM.Android/app/build/outputs/apk/debug/app-debug.apk \
            app/XDM.Android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            > "$RUNNER_TEMP/xgo-spark-evidence/apks.sha256"
      - name: Authenticate only after the long Android build (OIDC)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ env.XGO_FIREBASE_PROJECT_ID }}
          workload_identity_provider: ${{ env.XGO_FIREBASE_WIF_PROVIDER }}
          service_account: ${{ env.XGO_FIREBASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: '>= 520.0.0'
          project_id: ${{ env.XGO_FIREBASE_PROJECT_ID }}
      - name: Verify requested model is a real, supported ARM64 device (no quota spent)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/xgo-spark-evidence"
          gcloud firebase test android models describe "$XGO_SPARK_MODEL" \
            --project "$XGO_FIREBASE_PROJECT_ID" --format=json \
            > "$RUNNER_TEMP/xgo-spark-evidence/catalog-model.json"
          python3 -B scripts/xgo_firebase_spark_arm64.py check-model \
            --catalog-json "$RUNNER_TEMP/xgo-spark-evidence/catalog-model.json" \
            --model-id "$XGO_SPARK_MODEL" --version-id "$XGO_SPARK_VERSION"
      - name: Run one real ARM64 physical device instrumentation matrix
        shell: bash
        run: |
          set -euo pipefail
          gcloud firebase test android run \
            --project "$XGO_FIREBASE_PROJECT_ID" \
            --type instrumentation \
            --app app/XDM.Android/app/build/outputs/apk/debug/app-debug.apk \
            --test app/XDM.Android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            --device "model=${XGO_SPARK_MODEL},version=${XGO_SPARK_VERSION},locale=en,orientation=portrait" \
            --timeout 15m \
            --no-auto-google-login \
            --num-flaky-test-attempts=0 \
            --client-details "matrixLabel=XGO-Spark-ARM64-${GITHUB_RUN_ID}" \
            2>&1 | tee "$RUNNER_TEMP/xgo-spark-evidence/testlab-summary.txt"
          echo 'XGO_FIREBASE_SPARK_REAL_ARM64_INSTRUMENTATION_PASS'
      - name: Upload bounded acceptance receipt (not a passing result if tests failed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xgo-firebase-spark-arm64-acceptance-evidence
          path: ${{ runner.temp }}/xgo-spark-evidence/
          retention-days: 7
          if-no-files-found: warn
