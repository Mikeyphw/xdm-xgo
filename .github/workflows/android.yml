name: XDM Android CI

on:
  push:
    paths:
      - 'app/XDM.Android/**'
      - 'engine/**'
      - 'go.work'
      - 'tools/xgo/**'
      - '.devtool.toml'
      - 'build-release-apk.sh'
      - '.github/workflows/android.yml'
      - 'scripts/xgo_hf16_apk_pair.py'
      - 'scripts/test_xgo_hf16_apk_pair.py'
      - 'scripts/test_xgo_hf15_no_firebase.py'
      - 'scripts/run_physical_arm64_instrumentation.sh'
  pull_request:
    paths:
      - 'app/XDM.Android/**'
      - 'engine/**'
      - 'go.work'
      - 'tools/xgo/**'
      - '.devtool.toml'
      - 'build-release-apk.sh'
      - '.github/workflows/android.yml'
      - 'scripts/xgo_hf16_apk_pair.py'
      - 'scripts/test_xgo_hf16_apk_pair.py'
      - 'scripts/test_xgo_hf15_no_firebase.py'
      - 'scripts/run_physical_arm64_instrumentation.sh'
  workflow_dispatch:
    inputs:
      signed_release:
        description: 'Authorize signing only for an android-v* release tag'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  XDM_ANDROID_NDK_VERSION: '29.0.14206865'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app/XDM.Android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platform-tools'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Android SDK and NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;${XDM_ANDROID_NDK_VERSION}"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Static release contracts
        run: |
          python3 tools/validate-xar01-build-provenance.py
          python3 tools/validate-bug-hunt-phase10-release-upgrade-packaging.py
          python3 tools/verify-phase10-backup-policy.py
          python3 tools/validate-uix-r6-accessibility-performance-release-seal.py
          python3 tools/validate-bug-hunt-phase11-validation-matrix.py
          python3 tools/validate-xar17-313-root-closure.py
          bash tools/run-bug-hunt-phase11-validation-matrix.sh --static-only --ci
          python3 tools/validate-xar16-release-evidence-seal.py
          bash tools/run-final-release-gate.sh --ci
      - name: Bootstrap wrapper
        run: test -f gradle/wrapper/gradle-wrapper.jar || gradle wrapper --gradle-version 9.7.1
      - name: HF17 offline APK pair regressions
        working-directory: .
        run: python3 -B scripts/test_xgo_hf16_apk_pair.py
      - name: Post-DL03 final common validation
        run: bash tools/run-final-common-validation.sh
      - name: Verify and stage one native ARM64 debug/instrumentation APK pair
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/xgo_hf16_apk_pair.py \
            --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --app app/XDM.Android/app/build/outputs/apk/debug/app-debug.apk \
            --test app/XDM.Android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            --out "$RUNNER_TEMP/xdm-apk-pair"
      - name: Upload both APKs with one SHA256 source receipt (not device-tested)
        uses: actions/upload-artifact@v4
        with:
          name: xdm-android-physical-arm64-apk-pair
          path: ${{ runner.temp }}/xdm-apk-pair/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: xdm-android-debug-artifacts
          path: |
            app/XDM.Android/app/build/outputs/apk/debug/*.apk
            app/XDM.Android/browser-extension/build/outputs/xpi/*.xpi
            app/XDM.Android/browser-extension/build/outputs/xpi/release-artifacts.json
          if-no-files-found: error

  instrumentation:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Provision Cinderbox-proven API36 Google APIs image
        shell: bash
        run: |
          set -euo pipefail
          bash app/XDM.Android/tools/provision-hosted-emulator-runtime.sh --prepare
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
          for attempt in 1 2 3; do
            if sdkmanager --install 'emulator' 'system-images;android-36;google_apis;x86_64'; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::XDM_API36_IMAGE_INSTALL_FAILED"
              exit 1
            fi
            sleep 10
          done
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?}}"
          bash app/XDM.Android/tools/provision-hosted-emulator-runtime.sh --verify "$sdk_root"
          test -d "$sdk_root/system-images/android-36/google_apis/x86_64"
          avd_root="${ANDROID_AVD_HOME:-$HOME/.android/avd}"
          mkdir -p "$avd_root"
          available_kib="$(df -Pk "$avd_root" | awk 'END {print $4}')"
          [[ "$available_kib" =~ ^[0-9]+$ ]] || { echo "::error::XDM_AVD_DISK_QUERY_FAILED"; exit 1; }
          (( available_kib >= 4 * 1024 * 1024 )) || { echo "::error::XDM_AVD_DISK_INSUFFICIENT"; exit 1; }
      - name: Require KVM acceleration for Android instrumentation
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -c /dev/kvm ]]; then
            echo "::error::/dev/kvm is unavailable; refusing unaccelerated Android instrumentation"
            exit 1
          fi
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Android instrumentation matrix
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          disk-size: 3072M
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash app/XDM.Android/tools/run-hosted-emulator-instrumentation.sh --device
      - name: Upload bounded hosted instrumentation crash evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xdm-hosted-instrumentation-evidence
          path: ${{ runner.temp }}/xdm-instrumentation-evidence/
          retention-days: 7
          if-no-files-found: warn

  signed-release:
    if: startsWith(github.ref, 'refs/tags/android-v') && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.signed_release))
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: app/XDM.Android
    env:
      XDM_RELEASE_STORE_FILE: ${{ github.workspace }}/release-keystore.jks
      XDM_RELEASE_STORE_PASSWORD: ${{ secrets.XDM_RELEASE_STORE_PASSWORD }}
      XDM_RELEASE_KEY_ALIAS: ${{ secrets.XDM_RELEASE_KEY_ALIAS }}
      XDM_RELEASE_KEY_PASSWORD: ${{ secrets.XDM_RELEASE_KEY_PASSWORD }}
      XDM_RELEASE_SIGNER_SHA256: ${{ secrets.XDM_RELEASE_SIGNER_SHA256 }}
      XDM_RELEASE_CERTIFICATE_NOT_AFTER: ${{ secrets.XDM_RELEASE_CERTIFICATE_NOT_AFTER }}
      XDM_RELEASE_BUILD_ID: ${{ github.sha }}
      XDM_XAR16_PREVIOUS_RELEASE_APK: ${{ github.workspace }}/previous-release.apk
      XDM_XAR16_FULL_RELEASE_GATE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platform-tools'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore release keystore
        env:
          XDM_RELEASE_KEYSTORE_BASE64: ${{ secrets.XDM_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$XDM_RELEASE_KEYSTORE_BASE64"
          printf '%s' "$XDM_RELEASE_KEYSTORE_BASE64" | base64 -d > "$XDM_RELEASE_STORE_FILE"
      - name: Install pinned Android SDK and NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;${XDM_ANDROID_NDK_VERSION}"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Provision pinned bundletool
        run: echo "BUNDLETOOL_JAR=$(python3 tools/ensure-bundletool.py --print-path)" >> "$GITHUB_ENV"
      - name: Build pinned ARM64 aria2 runtime from source
        run: |
          python3 tools/build-aria2-runtime.py --build-pinned
      - name: Build pinned FFmpeg runtime
        run: python3 tools/install-ffmpeg-runtime.py --build-pinned
      - name: Fetch provenance-pinned previous release fixture
        env:
          XDM_PREVIOUS_RELEASE_APK_URL: ${{ secrets.XDM_PREVIOUS_RELEASE_APK_URL }}
          XDM_PREVIOUS_RELEASE_APK_SHA256: ${{ secrets.XDM_PREVIOUS_RELEASE_APK_SHA256 }}
        run: |
          test -n "$XDM_PREVIOUS_RELEASE_APK_URL"
          test -n "$XDM_PREVIOUS_RELEASE_APK_SHA256"
          curl --fail --location --proto '=https' "$XDM_PREVIOUS_RELEASE_APK_URL" --output "$XDM_XAR16_PREVIOUS_RELEASE_APK"
          printf '%s  %s\n' "$XDM_PREVIOUS_RELEASE_APK_SHA256" "$XDM_XAR16_PREVIOUS_RELEASE_APK" | sha256sum --check --strict
      - name: Provision Cinderbox-proven API36 Google APIs image
        shell: bash
        run: |
          set -euo pipefail
          bash tools/provision-hosted-emulator-runtime.sh --prepare
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
          for attempt in 1 2 3; do
            if sdkmanager --install 'emulator' 'system-images;android-36;google_apis;x86_64'; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::XDM_API36_IMAGE_INSTALL_FAILED"
              exit 1
            fi
            sleep 10
          done
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?}}"
          bash tools/provision-hosted-emulator-runtime.sh --verify "$sdk_root"
          test -d "$sdk_root/system-images/android-36/google_apis/x86_64"
          avd_root="${ANDROID_AVD_HOME:-$HOME/.android/avd}"
          mkdir -p "$avd_root"
          available_kib="$(df -Pk "$avd_root" | awk 'END {print $4}')"
          [[ "$available_kib" =~ ^[0-9]+$ ]] || { echo "::error::XDM_AVD_DISK_QUERY_FAILED"; exit 1; }
          (( available_kib >= 4 * 1024 * 1024 )) || { echo "::error::XDM_AVD_DISK_INSUFFICIENT"; exit 1; }
      - name: Require KVM acceleration for Android instrumentation
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -c /dev/kvm ]]; then
            echo "::error::/dev/kvm is unavailable; refusing unaccelerated Android instrumentation"
            exit 1
          fi
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Signed release, instrumentation, install, upgrade, and reboot gate
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          disk-size: 3072M
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash app/XDM.Android/tools/run-hosted-emulator-instrumentation.sh --signed-release
      - name: Upload bounded hosted release instrumentation crash evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xdm-hosted-release-instrumentation-evidence
          path: ${{ runner.temp }}/xdm-instrumentation-evidence/
          retention-days: 7
          if-no-files-found: warn
      - name: Attest Android publication metadata
        uses: actions/attest@v4
        with:
          subject-path: |
            app/XDM.Android/build/release/publication/SHA256SUMS
            app/XDM.Android/build/release/publication/SHA512SUMS
            app/XDM.Android/build/release/publication/release-metadata.json
      - uses: actions/upload-artifact@v4
        with:
          name: xdm-android-signed-release
          path: app/XDM.Android/build/release/publication/**/*
          if-no-files-found: error

  emulator-compatibility:
    # Native ARM64 Go JNI instrumentation remains a distinct, unresolved gate.
    # This is only an API36 x86_64 emulator environment/ADB smoke test.
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/android-v')
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platform-tools'
      - name: Provision API36 x86_64 emulator runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          bash app/XDM.Android/tools/provision-hosted-emulator-runtime.sh --prepare
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'emulator' 'system-images;android-36;google_apis;x86_64'
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?}}"
          bash app/XDM.Android/tools/provision-hosted-emulator-runtime.sh --verify "$sdk_root"
          test -d "$sdk_root/system-images/android-36/google_apis/x86_64"
      - name: Require hardware KVM
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm || { echo 'XGO_COMPAT_KVM_MISSING'; exit 2; }
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: API36 emulator infrastructure (NO native ARM64 test)
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          disk-size: 3072M
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash app/XDM.Android/tools/run-hosted-emulator-compatibility.sh
